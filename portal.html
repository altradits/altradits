<title>Client portal – Altradits</title>

<style>
/* Brand fonts, served from this site: Bricolage Grotesque and Figtree (SIL Open Font License 1.1, https://openfontlicense.org), latin and latin-ext (₿), variable weight */
@font-face{font-family:'Bricolage Grotesque';font-style:normal;font-weight:500 800;font-display:swap;src:url(/assets/bricolage-grotesque-latin.woff2) format('woff2');unicode-range:U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD}
@font-face{font-family:'Figtree';font-style:normal;font-weight:400 700;font-display:swap;src:url(/assets/figtree-latin.woff2) format('woff2');unicode-range:U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD}
@font-face{font-family:'Bricolage Grotesque';font-style:normal;font-weight:500 800;font-display:swap;src:url(/assets/bricolage-grotesque-latin-ext.woff2) format('woff2');unicode-range:U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF}
@font-face{font-family:'Figtree';font-style:normal;font-weight:400 700;font-display:swap;src:url(/assets/figtree-latin-ext.woff2) format('woff2');unicode-range:U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF}

:root{--bg:#EEF2F6;--ink:#0F1B2D;--muted:#4B5A70;--line:#C9D3DF;--blue:#2A5A8F;--paper:#fff;--ok:#0B7A5F;--warn:#E4572E;--btc:#F7931A}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 1rem/1.55 Figtree,system-ui,sans-serif}
h1,h2,h3{font-family:'Bricolage Grotesque',Figtree,sans-serif;line-height:1.15;margin:0}
[hidden]{display:none!important}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
a{color:var(--blue)}
.wrap{max-width:56rem;margin:0 auto;padding:1.25rem 1rem 4rem}
.logo{font:800 1.2rem 'Bricolage Grotesque',sans-serif;text-decoration:none;color:var(--ink);display:inline-block;margin-bottom:1rem}
.grid{display:grid;grid-template-columns:1.4fr 1fr;gap:1.25rem;align-items:start}
.card{background:var(--paper);border:2px solid var(--ink);border-radius:1.1rem;padding:1.2rem;margin-bottom:1.25rem}
.card.soft{border-color:var(--line)}
.card h2{font-size:1.2rem;margin-bottom:.7rem}
label{display:block;margin:.55rem 0;font-weight:600;font-size:.92rem}
label small{font-weight:400;color:var(--muted)}
input,textarea,select{width:100%;margin-top:.25rem;padding:.6rem .75rem;border:2px solid var(--line);border-radius:.6rem;font:inherit;background:var(--bg)}
textarea{min-height:4.5rem}
.btn{display:inline-flex;padding:.6rem 1.05rem;border-radius:.6rem;font:600 .95rem Figtree,sans-serif;border:2px solid var(--ink);cursor:pointer;background:transparent;color:var(--ink);text-decoration:none}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.row{display:flex;gap:.5rem;flex-wrap:wrap;margin-top:.6rem;align-items:center}
.task{border:2px solid var(--line);border-radius:.9rem;padding:.9rem;margin-bottom:.8rem}
.task.review{border-color:var(--ok)}
.task h3{font-size:1.05rem}
.st{display:inline-block;padding:.05rem .55rem;border-radius:99px;background:var(--bg);font-weight:600;font-size:.8rem}
.st.review{background:color-mix(in srgb,var(--ok) 20%,white)}
.st.waiting_client{background:color-mix(in srgb,var(--btc) 25%,white)}
.stars{display:inline-flex;gap:.15rem}
.stars button{border:0;background:none;font-size:1.5rem;line-height:1;cursor:pointer;color:var(--line);padding:0 .1rem}
.stars button.on{color:var(--btc)}
.files a{display:inline-block;margin:.2rem .4rem .2rem 0}
.st.changes{background:color-mix(in srgb,var(--warn) 18%,white)}
.meta{color:var(--muted);font-size:.86rem}
.meter{height:.7rem;background:var(--bg);border-radius:99px;overflow:hidden;margin:.4rem 0}
.meter i{display:block;height:100%;background:var(--blue)}
.ref{background:var(--ink);color:#fff;border-color:var(--ink)}
.ref code{display:block;background:rgba(255,255,255,.1);padding:.5rem .7rem;border-radius:.5rem;overflow-wrap:anywhere;margin:.5rem 0}
.ref .btn{border-color:#fff;color:#fff}
.err{color:#B42318}
.muted{color:var(--muted)}
.note{font-size:.88rem;color:var(--muted)}
@media (max-width:760px){.grid{grid-template-columns:1fr}}
.phead{display:flex;justify-content:space-between;align-items:center;gap:1rem;flex-wrap:wrap}.phead .help{font-size:.9rem;color:var(--muted,#4B5A70);display:inline-block;padding:.6rem 0}
.fieldpair{display:flex;flex-wrap:wrap;gap:.5rem;margin:0}.fieldpair label{flex:1 1 9rem;min-width:0}.fieldpair select{max-width:100%}
</style>
</head>
<body>
<div class="wrap">
  <div class="phead"><a class="logo" href="/"><img src="/assets/logo.png" alt="Altradits" width="325" height="119" style="height:2.4rem;width:auto;display:block"></a><a class="help" href="mailto:hello@altradits.com">Questions? hello@altradits.com</a></div>
  <div id="app"><p class="muted">Loading your portal…</p></div>
</div>
<script type="module" src="/assets/portal.js"></script>
</body>
</html>

<style>
/* Brand fonts, served from this site: Bricolage Grotesque and Figtree (SIL Open Font License 1.1, https://openfontlicense.org), latin and latin-ext (₿), variable weight */
@font-face{font-family:'Bricolage Grotesque';font-style:normal;font-weight:500 800;font-display:swap;src:url(/assets/bricolage-grotesque-latin.woff2) format('woff2');unicode-range:U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD}
@font-face{font-family:'Figtree';font-style:normal;font-weight:400 700;font-display:swap;src:url(/assets/figtree-latin.woff2) format('woff2');unicode-range:U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD}
@font-face{font-family:'Bricolage Grotesque';font-style:normal;font-weight:500 800;font-display:swap;src:url(/assets/bricolage-grotesque-latin-ext.woff2) format('woff2');unicode-range:U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF}
@font-face{font-family:'Figtree';font-style:normal;font-weight:400 700;font-display:swap;src:url(/assets/figtree-latin-ext.woff2) format('woff2');unicode-range:U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF}

:root{--bg:#EEF2F6;--ink:#0F1B2D;--muted:#4B5A70;--line:#C9D3DF;--blue:#2A5A8F;--btc:#F7931A;--btc-text:#A84D08;--ok:#0B7A5F;--paper:#fff;--navy:#274C77}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:400 1.0625rem/1.6 Figtree,system-ui,sans-serif}
a{color:var(--blue)}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
[hidden]{display:none!important}
.wrap{max-width:68rem;margin:0 auto;padding:0 1rem}
.top{display:flex;justify-content:space-between;align-items:center;gap:1rem;padding:1.1rem 0}
.top img{height:2.5rem;width:auto;display:block}
.topnav{display:flex;gap:1.1rem}
.topnav a{font-weight:600;text-decoration:none;color:var(--muted);white-space:nowrap}
@media (max-width:420px){.topnav{gap:.75rem}.topnav a{font-size:.9rem}.top img{height:1.9rem}}
.topnav a:hover{color:var(--ink)}
h1{font:800 clamp(2.3rem,7vw,4rem)/1.02 'Bricolage Grotesque',sans-serif;margin:.5rem 0 1rem;letter-spacing:-.015em;max-width:52rem}
h1 em,h2 em{font-style:normal;color:var(--btc-text)}
h2{font:800 clamp(1.7rem,4.5vw,2.5rem)/1.08 'Bricolage Grotesque',sans-serif;margin:.4rem 0 .7rem;letter-spacing:-.01em}
.lead{font-size:1.18rem;color:var(--muted);margin:0 0 1.7rem;max-width:40rem}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.4rem;padding:.9rem 1.35rem;border-radius:.75rem;font:700 1rem Figtree,sans-serif;text-decoration:none;border:2px solid var(--ink);color:var(--ink);background:transparent;transition:transform .2s,box-shadow .2s}
.btn:hover{box-shadow:4px 4px 0 var(--ink)}
.btn.dark{background:var(--ink);color:#fff}
.ctas{display:flex;flex-wrap:wrap;gap:.6rem}
.fine{color:var(--muted);font-size:.92rem;margin:.9rem 0 0}
.hero{padding:3.5rem 0 4rem}
section{padding:4.5rem 0;border-top:1px solid var(--line)}
.picks{list-style:none;margin:2rem 0 0;padding:0;display:grid;gap:1rem;grid-template-columns:repeat(3,1fr)}
.picks a{display:flex;flex-direction:column;gap:.3rem;height:100%;background:var(--paper);border:2px solid var(--ink);border-radius:1rem;padding:1.2rem;text-decoration:none;color:var(--ink);transition:box-shadow .2s,transform .2s}
.picks a:hover{box-shadow:5px 5px 0 var(--ink)}
.picks b{font:800 1.12rem/1.2 'Bricolage Grotesque',sans-serif}
.picks span{color:var(--muted);font-size:.95rem}
.picks .pr{display:flex;justify-content:space-between;align-items:baseline;margin-top:auto;padding-top:.6rem}
.picks .pr strong{font:800 1.5rem 'Bricolage Grotesque',sans-serif}
.picks .pr em{font-style:normal;font-weight:700;color:var(--ok)}
.all{display:inline-block;margin-top:1.4rem;font-weight:700}
@media (max-width:900px){.picks{grid-template-columns:1fr 1fr}}
@media (max-width:560px){.picks{grid-template-columns:1fr}.topnav{gap:.8rem}.hero{padding:2rem 0 3rem}section{padding:3.2rem 0}.find{flex-direction:column}}
.sitefoot{padding:1.5rem 0 2.5rem;color:var(--muted);font-size:.92rem;border-top:1px solid var(--line);margin-top:2rem}
.sitefoot a{color:var(--muted);display:inline-block;padding:.6rem 0}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
/* Hero: the same on every page — headline, one line, at most one button. No motion anywhere. */
.hero{position:static;display:block;max-width:none;margin:0;padding:2.25rem 0 2rem}
.hero h1{font:800 clamp(2.1rem,6vw,3.4rem)/1.06 'Bricolage Grotesque',Figtree,system-ui,sans-serif;letter-spacing:-.02em;margin:0;max-width:44rem;color:var(--ink)}
.hero h1 em{font-style:normal;color:var(--blue)}
.hero .lead{font-size:1.15rem;line-height:1.55;color:var(--muted);margin:.9rem 0 0;max-width:36rem}
.hero .btn{padding:.9rem 1.35rem;border-radius:.75rem;font:700 1rem Figtree,system-ui,sans-serif}
.hero .ctas{display:flex;flex-wrap:wrap;gap:.6rem;margin-top:1.4rem}
.top{margin:0!important;padding:1.1rem 0!important}
.sitefoot .wrap{padding-top:0;padding-bottom:0}
*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}
a:hover,.btn:hover,button:hover{transform:none!important}
</style>

<body id="top">
<div class="wrap">
  <div class="top"><a href="/" aria-label="Altradits home"><img src="/assets/logo.png" alt="Altradits" width="325" height="119"></a><nav class="topnav" aria-label="Main"><a href="/va">Tasks</a><a href="/products">Free kits</a><a href="/bitcoin">Accept <span aria-hidden="true">₿itcoin</span><span class="sr-only">Bitcoin</span></a></nav></div>

  <header class="hero">
    <h1>Small business tasks, <em>done today.</em></h1>
    <p class="lead">Fixed prices from $5. Pay with any Bitcoin wallet.</p>
    <div class="ctas"><a class="btn dark" href="/va">Pick a task</a></div>
  </header>
</div>

<section id="tasks"><div class="wrap">
  <h2>Most asked</h2>
  <ul class="picks" id="picks"></ul>
  <a class="all" href="/va" id="all">See every task →</a>
</div></section>

<footer class="sitefoot"><div class="wrap">© Altradits · <a href="/va">Tasks</a> · <a href="/products">Free kits</a> · <a href="/bitcoin">Accept Bitcoin</a> · <a href="/donate">Donate</a> · <a href="/collect">Collect an order</a> · <a href="/join">Join the team</a> · <a href="mailto:hello@altradits.com">hello@altradits.com</a></div></footer>

<script type="module">
import { QUICK_JOBS, orderPath } from "/data/catalog.js";
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);

// Clean addresses: /r/<ref> and /h/<hunt code> (old ?ref= and ?h= still work).
const params = new URLSearchParams(location.search);
const seg = location.pathname.split("/").filter(Boolean);
const pathRef = seg[0] === "r" ? seg[1] : null, pathHunt = seg[0] === "h" ? seg[1] : null;
const refCode = pathRef || params.get("ref");
try { if (/^[a-z0-9]{4,12}$/.test(refCode || "")) localStorage.setItem("altra.ref", refCode); } catch {}
if (pathRef || pathHunt) history.replaceState(null, "", "/" + location.hash); // tidy the address once recorded
// Opened from a treasure-hunt player's share link: that unlocks their coupon (once per browser).
try {
  const h = pathHunt || params.get("h");
  if (/^[a-z2-9]{8}$/.test(h || "") && !localStorage.getItem("altra.h." + h)) {
    localStorage.setItem("altra.h." + h, "1");
    fetch("/api/hunt", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ action: "visit", code: h }) }).catch(() => {});
  }
} catch {}

// Tasks and prices come from the catalog, so they never drift from the order page.
const PICKS = ["q-try", "q-inbox-cleanup", "q-captions", "q-invoices", "q-site-fix", "q-trip"];
$("#picks").innerHTML = PICKS.map((id) => QUICK_JOBS.find((q) => q.id === id)).filter(Boolean).map((q) =>
  `<li><a href="${orderPath(q.id)}"><b>${esc(q.name)}</b><span class="pr"><strong>$${q.price}</strong><em>${esc(q.delivery)}</em></span></a></li>`).join("");
$("#all").textContent = `See all ${QUICK_JOBS.length} tasks →`;

</script>
</body>
</html>

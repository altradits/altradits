name: Tests and security checks

# Every pull request and every push to main: the full test suite (including the
# build-stage security guard and the house-style rules in
# test/build-security.test.mjs) and a dependency audit. Actions are pinned by
# commit; the job can only read the repository.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, pinned by commit
        with:
          persist-credentials: false
          fetch-depth: 0 # full history, for the co-author check
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0, pinned by commit
        with:
          node-version: 24
      - name: Workflow files are valid (a broken file silently stops deploys)
        run: ruby -ryaml -e 'Dir[".github/workflows/*.yml"].each { |f| YAML.load_file(f) }; puts "workflows ok"'
      - name: No AI co-authors (GitHub lists every Co-Authored-By as a contributor)
        run: sh deploy/no-ai-coauthor.sh HEAD
      - name: Signed commits on main (every first-parent commit after TRUST_ROOT)
        if: github.event_name == 'push'
        run: sh deploy/verify-commits.sh HEAD .github/allowed_signers
      - name: Install (no package scripts run)
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Tests, security guard and house style
        run: npm test
      - name: Marketing art is visible and the logo stands clear
        run: |
          python3 -m pip install --quiet "pillow>=11" "numpy>=2" "imageio-ffmpeg"
          mkdir -p "$HOME/.local/bin"
          ln -sf "$(python3 -c 'import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())')" "$HOME/.local/bin/ffmpeg"
          export PATH="$HOME/.local/bin:$PATH"
          python3 deploy/art-check.py
      - name: Dependencies with known high or critical vulnerabilities
        run: npm audit --omit=dev --audit-level=high
      - name: Ye₿ente dependencies with known high or critical vulnerabilities
        working-directory: yebente
        run: npm audit --omit=dev --audit-level=high

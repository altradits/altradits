name: Deploy altradits.com

# Every push to main (including merged PRs) tells the live site to update
# itself. The DirectAdmin cron remains as a 5-minute backup.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Signatures (deploy/verify-commits.sh, the Bitcoin Core verify-commits model).
  # ADVISORY for now: commits from a machine without the signing key (the school
  # laptop) still deploy, with a warning on the run. To enforce, remove
  # "continue-on-error" below and create ~/.altradits-allowed-signers on the server.
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, pinned by commit
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Every commit on main is signed by a trusted key
        continue-on-error: true # advisory for now (see above)
        run: |
          if ! sh deploy/verify-commits.sh HEAD .github/allowed_signers; then
            echo "::warning::main has commits not signed by a trusted key (see the log above). Deploying anyway, because signatures are advisory for now."
            exit 1
          fi

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger deploy on the server
        env:
          DEPLOY_SECRET: ${{ secrets.DEPLOY_SECRET }}
        run: |
          for attempt in 1 2 3; do
            body=$(curl -sS --max-time 30 -X POST https://altradits.com/api/deploy -H "Content-Type: application/json" -H "X-Deploy-Secret: $DEPLOY_SECRET" -d '{}' || true)
            echo "attempt $attempt: $body"
            case "$body" in
              *'"started":true'*) echo "Deploy started."; exit 0 ;;
              *'deploy secret'*|*'DEPLOY_SECRET'*) echo "::warning::$body The 5-minute cron backup deploys instead."; exit 0 ;;
              *'"started":false'*) echo "A deploy ran within the last minute; the cron backup will pick up anything newer."; exit 0 ;;
            esac
            sleep 20
          done
          echo "::error::The server did not accept the deploy request (possibly blocked by the host's bot protection). The 5-minute cron backup will still try."
          exit 1

      - name: Confirm the site is healthy
        run: |
          sleep 45
          curl -fsS --max-time 30 https://altradits.com/healthz

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" width="100%" height="100%" style="background: transparent; font-family: 'Fira Code', 'JetBrains Mono', -apple-system, BlinkMacSystemFont, monospace;">
  <defs>
    <!-- Background and Glow Gradients -->
    <linearGradient id="termBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0c121e"/>
      <stop offset="100%" stop-color="#060911"/>
    </linearGradient>

    <linearGradient id="screenBeam" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F7931A" stop-opacity="0.16"/>
      <stop offset="55%" stop-color="#00ADD8" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </linearGradient>

    <!-- Card Backgrounds -->
    <linearGradient id="cardFork" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1c122e"/><stop offset="100%" stop-color="#0e081a"/>
    </linearGradient>
    <linearGradient id="cardIssue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2a1400"/><stop offset="100%" stop-color="#140800"/>
    </linearGradient>
    <linearGradient id="cardConflict" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2e0b0b"/><stop offset="100%" stop-color="#170404"/>
    </linearGradient>
    <linearGradient id="cardReview" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#002233"/><stop offset="100%" stop-color="#001017"/>
    </linearGradient>
    <linearGradient id="cardSolve" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#261b00"/><stop offset="100%" stop-color="#140d00"/>
    </linearGradient>
    <linearGradient id="cardMerge" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#092614"/><stop offset="100%" stop-color="#031207"/>
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="glowGold" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="glowGreen" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="glowPurple" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="glowRed" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <style><![CDATA[
      /* Pop-ups flying in and drifting over the terminal */
      @keyframes flyReview {
        0%, 100% { opacity: 0; transform: translate(30px, 15px) scale(0.85); }
        8%, 28% { opacity: 1; transform: translate(0px, 0px) scale(1); }
        34% { opacity: 0; transform: translate(-20px, -10px) scale(0.9); }
      }
      @keyframes flyFork {
        0%, 18% { opacity: 0; transform: translate(-30px, -15px) scale(0.85); }
        26%, 46% { opacity: 1; transform: translate(0px, 0px) scale(1); }
        52% { opacity: 0; transform: translate(20px, 10px) scale(0.9); }
        53%, 100% { opacity: 0; }
      }
      @keyframes flyIssue {
        0%, 36% { opacity: 0; transform: translate(30px, -15px) scale(0.85); }
        44%, 64% { opacity: 1; transform: translate(0px, 0px) scale(1); }
        70% { opacity: 0; transform: translate(-20px, 10px) scale(0.9); }
        71%, 100% { opacity: 0; }
      }
      @keyframes flyConflict {
        0%, 54% { opacity: 0; transform: translate(-30px, 15px) scale(0.85); }
        62%, 82% { opacity: 1; transform: translate(0px, 0px) scale(1); }
        88% { opacity: 0; transform: translate(15px, -5px) scale(0.9); }
        89%, 100% { opacity: 0; }
      }
      @keyframes flyMerge {
        0%, 72% { opacity: 0; transform: translate(25px, -12px) scale(0.85); }
        80%, 96% { opacity: 1; transform: translate(0px, 0px) scale(1.03); }
        99%, 100% { opacity: 0; transform: translate(0px, 10px) scale(0.92); }
      }

      @keyframes cursorBlink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }
      @keyframes screenPulse {
        0%, 100% { opacity: 0.9; }
        50% { opacity: 1; }
      }

      .pop-review { animation: flyReview 14s cubic-bezier(0.16, 1, 0.3, 1) infinite; }
      .pop-fork { animation: flyFork 14s cubic-bezier(0.16, 1, 0.3, 1) infinite; }
      .pop-issue { animation: flyIssue 14s cubic-bezier(0.16, 1, 0.3, 1) infinite; }
      .pop-conflict { animation: flyConflict 14s cubic-bezier(0.16, 1, 0.3, 1) infinite; }
      .pop-merge { animation: flyMerge 14s cubic-bezier(0.16, 1, 0.3, 1) infinite; }

      .cursor { animation: cursorBlink 0.75s infinite; }
      .screen-glow { animation: screenPulse 3s ease-in-out infinite; }
    ]]></style>
  </defs>

  <!-- STANDALONE TERMINAL WINDOW -->
  <!-- Outer Window Frame -->
  <rect x="2" y="2" width="676" height="296" rx="10" fill="url(#termBg)" stroke="#1f2c3f" stroke-width="1.5"/>

  <!-- Screen Ambient Glow -->
  <rect x="2" y="2" width="676" height="296" rx="10" fill="url(#screenBeam)" class="screen-glow"/>

  <!-- Terminal Top Header Bar -->
  <path d="M 2 12 Q 2 2 12 2 L 668 2 Q 678 2 678 12 L 678 30 L 2 30 Z" fill="#0e1524"/>
  <line x1="2" y1="30" x2="678" y2="30" stroke="#1c2738" stroke-width="1"/>

  <!-- macOS Traffic Light Window Buttons -->
  <circle cx="22" cy="16" r="4.5" fill="#ff5f56"/>
  <circle cx="36" cy="16" r="4.5" fill="#ffbd2e"/>
  <circle cx="50" cy="16" r="4.5" fill="#27c93f"/>

  <!-- Window Title -->
  <text x="68" y="20" font-size="10" fill="#8b949e" font-weight="600">terminal — lnd/channeldb/switch.go · git:(pr-139/merge) ⚡</text>

  <!-- TERMINAL CONTENT -->
  <!-- Left Side: Syntax Highlighted Go Code -->
  <g transform="translate(24, 60)">
    <text x="0" y="14" font-size="11.5" font-weight="600">
      <tspan fill="#F7931A">func </tspan>
      <tspan fill="#60a5fa">RouteSatsViaSwitch</tspan>
      <tspan fill="#ffffff">(p *Payment) error {</tspan>
    </text>
    <text x="18" y="36" font-size="11" fill="#9ca3af">htlc := p.VerifySignatures()</text>
    <text x="18" y="58" font-size="11">
      <tspan fill="#34d399">if </tspan>
      <tspan fill="#ffffff">err := s.SettleInvoice(htlc); err != nil {</tspan>
    </text>
    <text x="36" y="80" font-size="11">
      <tspan fill="#f87171">return </tspan>
      <tspan fill="#ffffff">err</tspan>
    </text>
    <text x="18" y="102" font-size="11" fill="#34d399">}</text>
    <text x="18" y="124" font-size="11">
      <tspan fill="#60a5fa">log.Printf</tspan>
      <tspan fill="#ffffff">(</tspan>
      <tspan fill="#fbbf24">"settled %d sats in 0.001s"</tspan>
      <tspan fill="#ffffff">, htlc.Amount)</tspan>
    </text>
    <text x="0" y="146" font-size="11.5" fill="#F7931A">}</text>

    <!-- Blinking Orange Block Cursor -->
    <rect x="14" y="156" width="8" height="15" fill="#F7931A" class="cursor"/>
  </g>

  <!-- Right Side: PROTOCOL PIPELINE Card -->
  <g transform="translate(380, 50)">
    <rect x="0" y="0" width="270" height="175" rx="8" fill="#080c14" stroke="#1c2838" stroke-width="1.2"/>
    <text x="16" y="24" font-size="9.5" fill="#8b949e" font-weight="700" letter-spacing="1">PROTOCOL PIPELINE</text>

    <!-- Node 1: Upstream master -->
    <circle cx="22" cy="50" r="4.5" fill="#A855F7" filter="url(#glowPurple)"/>
    <line x1="22" y1="50" x2="22" y2="148" stroke="#A855F7" stroke-width="1.5"/>
    <text x="36" y="54" font-size="9.5" fill="#e2e8f0" font-weight="500">upstream/master (lnd)</text>

    <!-- Node 2: Branch PR fix -->
    <circle cx="22" cy="85" r="4.5" fill="#F7931A" filter="url(#glowGold)"/>
    <line x1="22" y1="85" x2="68" y2="110" stroke="#F7931A" stroke-width="1.5"/>
    <circle cx="68" cy="110" r="4.5" fill="#00ADD8" filter="url(#glowCyan)"/>
    <text x="80" y="114" font-size="9.5" fill="#38BDF8" font-weight="500">pr-842/patch-fix</text>

    <!-- Node 3: Merged Target -->
    <line x1="68" y1="110" x2="22" y2="148" stroke="#2ea043" stroke-width="1.5"/>
    <circle cx="22" cy="148" r="5.5" fill="#2ea043" filter="url(#glowGreen)"/>
    <text x="36" y="152" font-size="9.5" fill="#4ade80" font-weight="700">MERGED (PR #139)</text>
  </g>

  <!-- DYNAMIC FLOATING POP-UPS OVER TERMINAL -->

  <!-- POP-UP 1: REVIEW & ACK (Primary Floating Badge) -->
  <g transform="translate(470, 118)">
    <g class="pop-review">
      <rect width="180" height="48" rx="8" fill="url(#cardReview)" stroke="#00ADD8" stroke-width="1.5" filter="url(#glowCyan)"/>
      <circle cx="20" cy="24" r="10" fill="#001826" stroke="#00ADD8" stroke-width="1"/>
      <text x="20" y="28" font-size="11" fill="#38BDF8" text-anchor="middle" font-weight="700">👁</text>
      <text x="38" y="20" font-size="10.5" font-weight="700" fill="#ffffff">REVIEW &amp; ACK</text>
      <text x="38" y="34" font-size="9" fill="#7dd3fc">PullOS / itest pass</text>
    </g>
  </g>

  <!-- POP-UP 2: FORK -->
  <g transform="translate(180, 75)">
    <g class="pop-fork">
      <rect width="170" height="44" rx="8" fill="url(#cardFork)" stroke="#A855F7" stroke-width="1.2" filter="url(#glowPurple)"/>
      <circle cx="18" cy="22" r="9" fill="#24103f" stroke="#A855F7" stroke-width="1"/>
      <text x="18" y="26" font-size="11" fill="#c084fc" text-anchor="middle" font-weight="700">⑂</text>
      <text x="34" y="18" font-size="10" font-weight="700" fill="#ffffff">FORK</text>
      <text x="34" y="32" font-size="8.5" fill="#c084fc">git fork lnd</text>
    </g>
  </g>

  <!-- POP-UP 3: ISSUE -->
  <g transform="translate(470, 118)">
    <g class="pop-issue">
      <rect width="180" height="48" rx="8" fill="url(#cardIssue)" stroke="#F7931A" stroke-width="1.2" filter="url(#glowGold)"/>
      <circle cx="20" cy="24" r="10" fill="#2b1400" stroke="#F7931A" stroke-width="1"/>
      <text x="20" y="28" font-size="11" fill="#F7931A" text-anchor="middle" font-weight="700">☉</text>
      <text x="38" y="20" font-size="10.5" font-weight="700" fill="#ffffff">ISSUE #842</text>
      <text x="38" y="34" font-size="9" fill="#fbbf24">channel state race</text>
    </g>
  </g>

  <!-- POP-UP 4: CONFLICT -->
  <g transform="translate(180, 120)">
    <g class="pop-conflict">
      <rect width="170" height="44" rx="8" fill="url(#cardConflict)" stroke="#ef4444" stroke-width="1.2" filter="url(#glowRed)"/>
      <circle cx="18" cy="22" r="9" fill="#330707" stroke="#ef4444" stroke-width="1"/>
      <text x="18" y="26" font-size="11" fill="#f87171" text-anchor="middle" font-weight="700">⚠</text>
      <text x="34" y="18" font-size="10" font-weight="700" fill="#ffffff">CONFLICT</text>
      <text x="34" y="32" font-size="8.5" fill="#fca5a5">rebase main</text>
    </g>
  </g>

  <!-- POP-UP 5: MERGE -->
  <g transform="translate(460, 118)">
    <g class="pop-merge">
      <rect width="190" height="48" rx="8" fill="url(#cardMerge)" stroke="#2ea043" stroke-width="1.5" filter="url(#glowGreen)"/>
      <circle cx="20" cy="24" r="10" fill="#041d0c" stroke="#2ea043" stroke-width="1"/>
      <text x="20" y="28" font-size="11" fill="#4ade80" text-anchor="middle" font-weight="700">✓</text>
      <text x="38" y="20" font-size="10.5" font-weight="700" fill="#ffffff">MERGE UPSTREAM</text>
      <text x="38" y="34" font-size="9" fill="#4ade80">PR #139 Merged · Production</text>
    </g>
  </g>
</svg>

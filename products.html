<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/assets/favicon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="canonical" href="https://altradits.com/products">
<title>Free kits · Altradits</title>
<meta name="description" content="Free step-by-step kits for the small business jobs owners put off: inbox, social posts, invoices, customer replies, outreach and hiring. Or have it done today at a fixed price.">
<link rel="preload" as="font" type="font/woff2" href="/assets/bricolage-grotesque-latin.woff2" crossorigin>
<link rel="preload" as="font" type="font/woff2" href="/assets/figtree-latin.woff2" crossorigin>
<style>
/* Brand fonts, served from this site: Bricolage Grotesque and Figtree (SIL Open Font License 1.1, https://openfontlicense.org), latin and latin-ext (₿), variable weight */
@font-face{font-family:'Bricolage Grotesque';font-style:normal;font-weight:500 800;font-display:swap;src:url(/assets/bricolage-grotesque-latin.woff2) format('woff2');unicode-range:U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD}
@font-face{font-family:'Figtree';font-style:normal;font-weight:400 700;font-display:swap;src:url(/assets/figtree-latin.woff2) format('woff2');unicode-range:U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD}
@font-face{font-family:'Bricolage Grotesque';font-style:normal;font-weight:500 800;font-display:swap;src:url(/assets/bricolage-grotesque-latin-ext.woff2) format('woff2');unicode-range:U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF}
@font-face{font-family:'Figtree';font-style:normal;font-weight:400 700;font-display:swap;src:url(/assets/figtree-latin-ext.woff2) format('woff2');unicode-range:U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF}

:root{--bg:#EEF2F6;--ink:#0F1B2D;--muted:#4B5A70;--line:#C9D3DF;--blue:#2A5A8F;--btc:#F7931A;--btc-text:#A84D08;--ok:#0B7A5F;--paper:#fff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 1.0625rem/1.6 Figtree,system-ui,sans-serif}
a{color:var(--blue)}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
[hidden]{display:none!important}
.wrap{max-width:68rem;margin:0 auto;padding:0 1rem 1rem}
.sitefoot .wrap{padding-top:0;padding-bottom:0}
.top{display:flex;justify-content:space-between;align-items:center;gap:1rem;margin-bottom:2rem}
.top img{height:2.5rem;width:auto;display:block}
.topnav{display:flex;gap:1.1rem}
.topnav a{font-weight:600;text-decoration:none;color:var(--muted);white-space:nowrap}
@media (max-width:420px){.topnav{gap:.75rem}.topnav a{font-size:.9rem}.top img{height:1.9rem}}
.topnav a:hover,.topnav a[aria-current]{color:var(--ink)}
.top a.jobs:hover{color:var(--ink)}
h1{font:800 clamp(2rem,6vw,3.3rem)/1.04 'Bricolage Grotesque',sans-serif;margin:0 0 .7rem;max-width:44rem;letter-spacing:-.01em}
h1 em{font-style:normal;color:var(--blue)}
.lead{color:var(--muted);font-size:1.15rem;margin:0;max-width:36rem}
.kits{display:grid;grid-template-columns:repeat(auto-fill,minmax(20rem,1fr));gap:1.25rem}
.kit{background:var(--paper);border:2px solid var(--ink);border-radius:1rem;padding:1.4rem;display:flex;flex-direction:column;gap:.6rem}
.kit:hover{box-shadow:5px 5px 0 var(--ink)}
.acts{display:flex;flex-wrap:wrap;gap:.5rem;margin-top:auto;padding-top:.6rem}
.acts .btn{flex:1 1 8rem;white-space:nowrap;padding:.75rem .8rem;font-size:.95rem}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.ghost:hover{background:var(--bg)}
.kit h3{font:800 1.3rem/1.2 'Bricolage Grotesque',sans-serif;margin:0}
.kit p{margin:0;color:var(--muted)}
.kit ul{margin:.1rem 0 0;padding-left:0;list-style:none;display:grid;gap:.3rem;font-size:.95rem}
.kit ul li{position:relative;padding-left:1.4rem}
.kit ul li::before{content:"✓";position:absolute;left:0;color:var(--ok);font-weight:800}
.files{display:flex;flex-wrap:wrap;gap:.4rem;margin-top:auto;padding-top:.3rem}
.files span{font:600 .8rem Figtree,sans-serif;background:var(--bg);border-radius:.45rem;padding:.2rem .55rem;color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.4rem;padding:.8rem 1.2rem;border-radius:.7rem;font:700 1rem Figtree,sans-serif;border:2px solid var(--ink);cursor:pointer;background:var(--ink);color:#fff;text-decoration:none}
.btn.blue{background:var(--blue);border-color:var(--blue)}
.form{display:grid;gap:.5rem;border-top:1px solid var(--line);padding-top:.9rem}
.form input{width:100%;padding:.7rem .8rem;border:2px solid var(--line);border-radius:.6rem;font:inherit;background:var(--bg)}
.form input:focus{border-color:var(--ink);background:#fff}
.form .hp{position:absolute;left:-9999px;width:1px;height:1px;opacity:0}
.form small{color:var(--muted);font-size:.8rem;line-height:1.45}
.msg{margin:0;font-size:.92rem;color:var(--muted)}
.msg.err{color:#B42318}
.got{border-top:1px solid var(--line);padding-top:.9rem;display:grid;gap:.6rem}
.got .row{display:flex;flex-wrap:wrap;gap:.5rem}
.next{background:var(--bg);border-radius:.8rem;padding:.8rem .9rem;display:grid;gap:.45rem;font-size:.93rem}
.next b{font:800 .95rem 'Bricolage Grotesque',sans-serif}
.next a{display:flex;justify-content:space-between;gap:.8rem;text-decoration:none;color:var(--ink);font-weight:600;padding:.35rem 0;border-top:1px solid var(--line)}
.next a:first-of-type{border-top:0}
.next a span:last-child{color:var(--blue);white-space:nowrap}
@media (max-width:420px){.kits{grid-template-columns:1fr}.kit{padding:1.15rem}}
.form input[aria-invalid=true]{border-color:#B42318}
.sitefoot{padding:1.5rem 0 2.5rem;color:var(--muted);font-size:.92rem;border-top:1px solid var(--line);margin-top:2rem}
.sitefoot a{color:var(--muted);display:inline-block;padding:.6rem 0}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
/* Hero: the same on every page — headline, one line, at most one button. No motion anywhere. */
.hero{position:static;display:block;max-width:none;margin:0;padding:2.25rem 0 2rem}
.hero h1{font:800 clamp(2.1rem,6vw,3.4rem)/1.06 'Bricolage Grotesque',Figtree,system-ui,sans-serif;letter-spacing:-.02em;margin:0;max-width:44rem;color:var(--ink)}
.hero h1 em{font-style:normal;color:var(--blue)}
.hero .lead{font-size:1.15rem;line-height:1.55;color:var(--muted);margin:.9rem 0 0;max-width:36rem}
.hero .btn{padding:.9rem 1.35rem;border-radius:.75rem;font:700 1rem Figtree,system-ui,sans-serif}
.hero .ctas{display:flex;flex-wrap:wrap;gap:.6rem;margin-top:1.4rem}
.top{margin:0!important;padding:1.1rem 0!important}
.sitefoot .wrap{padding-top:0;padding-bottom:0}
*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}
a:hover,.btn:hover,button:hover{transform:none!important}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><a href="/" aria-label="Altradits home"><img src="/assets/logo.png" alt="Altradits" width="325" height="119"></a><nav class="topnav" aria-label="Main"><a href="/va">Tasks</a><a href="/products" aria-current="page">Free kits</a><a href="/bitcoin">Accept <span aria-hidden="true">₿itcoin</span><span class="sr-only">Bitcoin</span></a></nav></div>
  <header class="hero">
    <h1>Free kits for the jobs <em>you keep putting off.</em></h1>
    <p class="lead">Free for your email, or done for you today.</p>
  </header>

  <div class="kits" id="kits"><p class="msg">Loading the kits…</p></div>

</div>
<footer class="sitefoot"><div class="wrap">© Altradits · <a href="/va">Tasks</a> · <a href="/products">Free kits</a> · <a href="/bitcoin">Accept Bitcoin</a> · <a href="/donate">Donate</a> · <a href="/collect">Collect an order</a> · <a href="/join">Join the team</a> · <a href="mailto:hello@altradits.com">hello@altradits.com</a></div></footer>
<script type="module">
const $ = (s, el = document) => el.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const money = (n) => "$" + Number(n).toLocaleString("en-US");
const store = { get: (k) => { try { return JSON.parse(localStorage.getItem(k)) || null; } catch { return null; } }, set: (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} } };
const TYPES = { pdf: "PDF guide", csv: "Spreadsheet" };

let data;
try { data = await (await fetch("/api/kits")).json(); } catch { $("#kits").innerHTML = `<p class="msg err">Couldn't load the kits. Please refresh.</p>`; }
if (data) {
  // The fixed-price task that does each kit's job for you (monthly services stay off this page).
  const task = (k) => (k.offers?.done || []).find((o) => !o.monthly);
  $("#kits").innerHTML = data.kits.map((k) => `<article class="kit" id="${esc(k.id)}">
    <h3>${esc(k.title)}</h3>
    <p>${esc(k.promise)}</p>
    <div class="acts">
      <button class="btn" type="button" data-open="${esc(k.id)}">Get it free</button>
      ${task(k) ? `<a class="btn ghost" href="${esc(new URL(task(k).url).pathname)}" title="${esc(task(k).name)}">Done for you · ${money(task(k).price)}</a>` : ""}
    </div>
    <form class="form" data-kit="${esc(k.id)}" hidden novalidate>
      <input type="email" name="email" placeholder="you@business.com" autocomplete="email" aria-label="Your email" required>
      <p class="msg" role="status"></p>
      <input type="text" name="name" placeholder="First name (optional)" autocomplete="given-name" aria-label="First name">
      <input class="hp" type="text" name="website" tabindex="-1" autocomplete="off" aria-hidden="true">
      <button class="btn blue">Send me the kit</button>
      <small>${esc(k.consent)}</small>
    </form>
    <div class="got" hidden></div>
  </article>`).join("");

  // Seen this visitor before? Skip straight to the form with their details.
  document.addEventListener("click", (e) => {
    const id = e.target.dataset?.open; if (!id) return;
    const me = store.get("altra.sub");
    const card = document.getElementById(id), form = $("form", card);
    e.target.closest(".acts").hidden = true; form.hidden = false;
    if (me) { form.email.value = me.email || ""; form.name.value = me.name || ""; }
    (form.email.value ? $("button", form) : form.email).focus();
  });
  document.addEventListener("submit", async (e) => {
    const form = e.target.closest("form[data-kit]"); if (!form) return;
    e.preventDefault();
    const msg = $(".msg", form), kitId = form.dataset.kit, kit = data.kits.find((k) => k.id === kitId);
    const email = form.email.value.trim(), name = form.name.value.trim();
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email)) { msg.className = "msg err"; msg.textContent = "Please check your email address."; form.email.setAttribute("aria-invalid", "true"); form.email.focus(); return; }
    form.email.removeAttribute("aria-invalid");
    msg.className = "msg"; msg.textContent = "Sending…";
    try {
      const r = await fetch("/api/kits", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ kit: kitId, email, name, website: form.website.value }) });
      const d = await r.json();
      if (!r.ok) throw new Error(d.error || "Something went wrong.");
      store.set("altra.sub", { email, name });
      form.hidden = true;
      const got = $(".got", form.closest(".kit"));
      got.hidden = false;
      // Already on our list: the kit goes to that inbox only, never to this page.
      got.innerHTML = `${d.files ? `<b>It's yours: download it below.</b> To get it by email too, tap the confirmation link we've sent to ${esc(email)}.
        <div class="row">${d.files.map((f) => `<a class="btn" href="${esc(f.url)}" download>Download ${esc(TYPES[f.type] || f.type)}</a>`).join("")}</div>` : d.limit ? `<b>This kit was already emailed to this address today.</b> To keep inboxes safe, each kit is sent at most once a day. Check your inbox (and Promotions and Spam), or pick a different kit.`
          : d.confirm ? `<b>Check your inbox: tap the confirmation link we've sent to ${esc(email)}</b> and the kit follows straight away. Not there? Look in Promotions and Spam.`
          : `<b>Sent! Check your inbox at ${esc(email)}.</b> Not there in a few minutes? Look in Promotions and Spam.`}
        ${task(kit) ? `<div class="next"><b>Rather have it done today?</b>
          <a href="${esc(new URL(task(kit).url).pathname)}"><span>${esc(task(kit).name)}</span><span>${money(task(kit).price)}</span></a>
        </div>` : ""}`;
      form.closest(".kit").querySelector(".acts")?.remove(); // the offer now shows once, in the box above
      $("a", got).focus();
    } catch (err) { msg.className = "msg err"; msg.textContent = err.message; }
  });
  if (location.hash) document.getElementById(location.hash.slice(1))?.scrollIntoView();
}
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/assets/favicon-32.png" type="image/png" sizes="32x32">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: https:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'">
<script src="/assets/report.js"></script>
<title>Node dashboard · Altradits</title>
<style>
@font-face{font-family:'Bricolage Grotesque';font-style:normal;font-weight:500 800;font-display:swap;src:url(/assets/bricolage-grotesque-latin.woff2) format('woff2')}
@font-face{font-family:'Figtree';font-style:normal;font-weight:400 700;font-display:swap;src:url(/assets/figtree-latin.woff2) format('woff2')}
:root{--bg:#EEF2F6;--ink:#0F1B2D;--muted:#4B5A70;--line:#C9D3DF;--blue:#2A5A8F;--btc:#F7931A;--paper:#fff;--ok:#0B7A5F;--warn:#B54708;--crit:#B42318}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 1rem/1.55 Figtree,system-ui,sans-serif}
h1,h2{font-family:'Bricolage Grotesque',Figtree,sans-serif;line-height:1.15;margin:0}
[hidden]{display:none!important}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
a{color:var(--blue)}
.wrap{max-width:74rem;margin:0 auto;padding:1rem}
header{display:flex;justify-content:space-between;align-items:center;gap:1rem;padding:.5rem 0 1rem;flex-wrap:wrap}
header img{height:2.2rem;width:auto;display:block}
header h1{font-size:1.3rem}
.brand{display:flex;align-items:center;gap:.8rem}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(10rem,1fr));gap:.75rem;margin-bottom:.8rem}
.kpi{background:var(--bg);border:2px solid var(--line);border-radius:.9rem;padding:.75rem .9rem}
.kpi.warn{border-color:var(--warn)}
.kpi small{color:var(--muted);font-weight:600;font-size:.78rem;text-transform:uppercase;letter-spacing:.04em}
.kpi div{font:800 1.5rem/1.15 'Bricolage Grotesque',sans-serif;margin-top:.2rem;overflow-wrap:anywhere}
.panel{background:var(--paper);border:2px solid var(--ink);border-radius:1rem;padding:1.1rem;margin-bottom:1.1rem}
.panel h2{font-size:1.15rem;margin-bottom:.7rem}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:1.1rem}
@media (max-width:760px){.grid2{grid-template-columns:1fr}}
table{width:100%;border-collapse:collapse;font-size:.92rem}
.scroll{overflow-x:auto}
th,td{text-align:left;padding:.5rem .4rem;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:.78rem;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
dl{display:grid;grid-template-columns:minmax(8rem,14rem) 1fr;gap:.3rem .8rem;margin:0;font-size:.93rem}
dt{color:var(--muted)}
dd{margin:0;overflow-wrap:anywhere}
input,textarea{width:100%;padding:.6rem .75rem;border:2px solid var(--line);border-radius:.6rem;font:inherit;background:var(--bg)}
.mono{font:12px ui-monospace,Menlo,monospace;margin-top:.5rem}
.btn{display:inline-flex;align-items:center;min-height:2.6rem;padding:.5rem 1rem;border-radius:.6rem;font:600 .93rem Figtree,sans-serif;border:2px solid var(--ink);cursor:pointer;background:transparent;color:var(--ink);text-decoration:none}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
.row{display:flex;gap:.5rem;flex-wrap:wrap;margin-top:.6rem;align-items:center}
.sm{font-size:.86rem}
.muted{color:var(--muted)}
.err{color:var(--crit)}
.ok{color:var(--ok)}
.alert{margin:0 0 .6rem;padding:.6rem .8rem;border-radius:.6rem;border:1px solid}
.alert.crit{color:var(--crit);border-color:var(--crit)}.alert.warn{color:var(--warn);border-color:var(--warn)}
.bar{display:block;background:#E4E9F0;border-radius:4px;height:8px;width:7rem}.bar i{display:block;background:var(--blue);border-radius:4px;height:8px}
.spark{display:flex;align-items:flex-end;gap:3px;height:3rem;margin:.4rem 0 .8rem}.spark i{flex:1;background:var(--blue);border-radius:2px 2px 0 0;min-height:2px}
.qr{max-width:15rem;background:#fff;padding:.5rem;border-radius:8px}.qr svg{width:100%;height:auto;display:block}
.ev{border-bottom:1px solid var(--line);padding:.4rem 0}
.events{max-height:24rem;overflow-y:auto}
.login{max-width:24rem;margin:15vh auto;background:var(--paper);border:2px solid var(--ink);border-radius:1rem;padding:1.5rem}
.login img{height:2.4rem;width:auto;display:block;margin-bottom:1rem}
#toast{position:fixed;left:50%;bottom:1.2rem;transform:translateX(-50%);background:var(--ink);color:#fff;padding:.6rem 1rem;border-radius:.6rem;font-weight:600;z-index:9}
#toast.fail{background:var(--crit)}
</style>
</head>
<body>
<form class="login" id="login" hidden>
  <img src="/assets/logo.png" alt="Altradits" width="325" height="119">
  <label for="tok"><b>Admin token</b></label>
  <input id="tok" type="password" autocomplete="current-password" required>
  <div class="row"><button class="btn primary" type="submit">Open the dashboard</button></div>
  <p class="err" id="loginErr" role="alert"></p>
</form>

<div class="wrap" id="app" hidden>
  <header>
    <div class="brand"><a href="/"><img src="/assets/logo.png" alt="Altradits" width="325" height="119"></a><h1>Node dashboard</h1></div>
    <div class="row"><span class="sm muted" id="checked"></span><button type="button" class="btn" id="refresh">Refresh</button><button type="button" class="btn" id="logout">Sign out</button></div>
  </header>

  <section class="panel" aria-labelledby="hNode">
    <h2 id="hNode">Node</h2>
    <div class="kpis" id="nodeKpis"></div>
    <p class="sm muted" id="nodeNote"></p>
  </section>

  <section class="panel" aria-labelledby="hYb">
    <h2 id="hYb">Ye₿ente and settlement</h2>
    <div class="kpis" id="ybKpis"></div>
    <dl id="hooks"></dl>
  </section>

  <div class="grid2">
    <section class="panel" aria-labelledby="hPower">
      <h2 id="hPower">Sending power</h2>
      <p class="sm" id="spNote"></p>
      <label for="spSats" class="sm"><b>Top up the node (sats)</b></label>
      <input id="spSats" type="number" inputmode="numeric">
      <div class="row" id="spPresets"></div>
      <div class="row"><button type="button" class="btn primary" id="spGo">Make a top-up invoice</button></div>
      <p class="err sm" id="spErr" role="alert"></p>
      <div id="spInvoice"></div>
      <div id="spList"></div>
    </section>
    <section class="panel" aria-labelledby="hVisits">
      <h2 id="hVisits">Visits</h2>
      <div id="visits" class="scroll"></div>
    </section>
  </div>

  <section class="panel" aria-labelledby="hCh">
    <h2 id="hCh">Channels and routing</h2>
    <div id="lnAlerts"></div>
    <div id="lnList" class="scroll"></div>
    <div id="lnAdvice" class="sm"></div>
    <h2 style="font-size:1rem;margin-top:1rem">Lessons from running the node</h2>
    <div class="row"><input id="lnLesson" placeholder="A lesson worth keeping" aria-label="New lesson"><button type="button" class="btn" id="lnAdd">Add</button></div>
    <ul id="lnLessons" class="sm"></ul>
  </section>

  <div class="grid2">
    <section class="panel" aria-labelledby="hSec">
      <h2 id="hSec">Security watch</h2>
      <div class="kpis" id="secKpis"></div>
      <p class="sm" id="secSolvency"></p>
      <div class="events" id="secEvents"></div>
    </section>
    <section class="panel" aria-labelledby="hHist">
      <h2 id="hHist">Bitcoin's attack history, and our guards</h2>
      <div class="events" id="secHistory"></div>
    </section>
  </div>

  <section class="panel" aria-labelledby="hMail">
    <h2 id="hMail">Emails sent</h2>
    <div id="emails" class="scroll"></div>
  </section>

  <section class="panel" aria-labelledby="hSys">
    <h2 id="hSys">System</h2>
    <dl id="system"></dl>
    <h2 style="font-size:1rem;margin-top:1rem">Archive files</h2>
    <div id="archives"></div>
  </section>
</div>
<div id="toast" role="status" aria-live="polite" hidden></div>
<script type="module" src="/assets/admin.js"></script>
</body>
</html>
